{% extends "base.html" %}
{% block title %}登录 · {{ app_name }}{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">VERTICAL AI INTELLIGENCE</p>
  <h1>登录每日 AI 新闻助手</h1>
  <p class="muted">追踪 LLM、半导体、芯片、自动驾驶与重要未来事件。</p>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack-form">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>邮箱<input type="email" name="email" required autocomplete="email"></label>
    <label>密码<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="primary" type="submit">登录</button>
  </form>
  <p class="muted">还没有账户？<a href="/register">创建账户</a></p>
</section>
{% endblock %}
